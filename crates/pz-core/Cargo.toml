[package]
name = "pz-core"
description = "Photonic Zero (PZ): a rateless screen-to-camera optical data protocol. Encoder, decoder, frame format and renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["optical", "air-gap", "barcode", "fountain-codes", "qr"]
categories = ["encoding", "multimedia::images", "computer-vision"]

[features]
default = ["std", "png"]
std = ["pz-fec/std", "pz-fountain/std", "pz-vision/std"]
png = []

[dependencies]
pz-fec = { workspace = true }
pz-fountain = { workspace = true }
pz-vision = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
