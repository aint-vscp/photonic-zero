name: Release

# Publishes to crates.io, npm and PyPI, and attaches CLI binaries to the
# GitHub release.
#
# Trigger by pushing a tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`,
# or run manually with `dry_run` left on to rehearse everything without
# publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Nothing is published unless the whole suite passes on every platform.
  verify:
    name: Verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - run: cargo test --release --manifest-path crates/pz-ffi/Cargo.toml

  cli-binaries:
    name: CLI / ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p pz-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/pz${{ matrix.ext }}" staging/
          cp README.md LICENSE-MIT LICENSE-APACHE staging/
          tar -czf "pz-${{ matrix.target }}.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: pz-${{ matrix.target }}.tar.gz

  python-wheels:
    name: Wheel / ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux-x86_64,  args: "--target x86_64-unknown-linux-gnu" }
          - { os: ubuntu-latest,  platform: linux-aarch64, args: "--target aarch64-unknown-linux-gnu" }
          - { os: macos-latest,   platform: macos,         args: "--target universal2-apple-darwin" }
          - { os: windows-latest, platform: windows,       args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # abi3-py38 means one wheel per platform covers every Python from 3.8 up.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          args: --release --out ../../dist ${{ matrix.args }}
          manylinux: auto

      - name: Smoke test
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows'
        shell: bash
        run: |
          # --no-index matters: once 0.1.0 is on PyPI, a plain --find-links can
          # resolve the published wheel instead of the one just built, and the
          # smoke test would silently be testing the wrong artifact.
          python -m pip install --no-index --find-links dist photonic-zero
          python -m pip install pytest
          python -m pytest bindings/python/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

  python-sdist:
    name: Python sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*.tar.gz

  npm-package:
    name: npm package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: Swatinem/rust-cache@v2

      - name: Build the wasm module
        working-directory: packages/js
        run: npm run build

      - name: Test
        working-directory: packages/js
        run: npm test

      - name: Pack
        working-directory: packages/js
        run: npm pack --pack-destination ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz

  publish-crates:
    name: Publish to crates.io
    needs: [cli-binaries, python-wheels, npm-package]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Dependency order matters: a crate cannot be published until everything
      # it depends on is already on the registry and indexed.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in pz-fec pz-fountain pz-vision pz-core pz-cli; do
            echo "publishing $crate"
            # Only an already-published version is survivable, and it has to be
            # matched specifically. A blanket `|| true` would turn an auth,
            # network or manifest failure into a green job, and the release
            # would then be cut with crates missing from the registry.
            if ! output=$(cargo publish -p "$crate" 2>&1); then
              printf '%s\n' "$output"
              if printf '%s' "$output" | grep -qiE 'already (been )?(uploaded|published|exists)'; then
                echo "$crate is already published at this version; continuing"
              else
                echo "::error::publishing $crate failed"
                exit 1
              fi
            else
              printf '%s\n' "$output"
            fi
            # Give the index time to catch up before the next crate resolves it.
            sleep 45
          done

  publish-npm:
    name: Publish to npm
    needs: [cli-binaries, python-wheels, npm-package]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        working-directory: packages/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-pypi:
    name: Publish to PyPI
    # python-sdist included deliberately: without it this job can start before
    # the sdist artifact exists and quietly ship wheels only.
    needs: [cli-binaries, python-wheels, python-sdist, npm-package]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # Trusted publishing: configure the repository as a trusted publisher on
      # PyPI and no API token is needed.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: GitHub release
    needs: [publish-crates, publish-npm, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.whl
            artifacts/*.tgz
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/thepieza/photonic-zero/blob/main/CHANGELOG.md).

            ```console
            cargo add pz-core
            npm install photonic-zero
            pip install photonic-zero
            ```
